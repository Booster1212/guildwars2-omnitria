name: Update Download Badge

on:
  schedule:
    - cron: '0 0,12 * * *' # Twice a day at 00:00 and 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    name: Recalculate Verified Downloads
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recalculate Real Downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-download-badge.mjs

      - name: Commit & Push if Updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/downloads.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(badge): refresh verified download count [skip ci]" && git push origin main)
